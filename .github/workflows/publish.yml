name: Publish

# Tag-triggered npm publish via npm Trusted Publishing (OIDC) — no NPM_TOKEN.
# Tag format: <package>-v<version>, e.g.
#   core-v0.1.0 | web-v0.1.1 | react-native-v0.1.0 | mcp-v0.1.0
# The tag prefix selects the workspace so platforms version independently.
#
# One-time setup on npmjs.com (per package, under Settings → Trusted Publisher):
#   Provider  = GitHub Actions
#   Org/repo  = Pulse-Circle-Studio/pulse-sdk
#   Workflow  = publish.yml
# After that, publishes from this workflow authenticate over OIDC and generate
# provenance automatically — there is no long-lived token to leak or rotate.
on:
  push:
    tags:
      - 'core-v*'
      - 'web-v*'
      - 'react-native-v*'
      - 'mcp-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Resolve package from tag
        id: pkg
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            core-v*)         echo "workspace=@pulse-circle/core" >> "$GITHUB_OUTPUT" ;;
            web-v*)          echo "workspace=@pulse-circle/web" >> "$GITHUB_OUTPUT" ;;
            react-native-v*) echo "workspace=@pulse-circle/react-native" >> "$GITHUB_OUTPUT" ;;
            mcp-v*)          echo "workspace=@pulse-circle/mcp" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unrecognized tag $tag" && exit 1 ;;
          esac
          echo "version=${tag##*-v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json version
        run: |
          pkg_version=$(node -p "require('./packages/${GITHUB_REF_NAME%%-v*}/package.json').version")
          if [ "$pkg_version" != "${{ steps.pkg.outputs.version }}" ]; then
            echo "Tag version ${{ steps.pkg.outputs.version }} != package.json $pkg_version" && exit 1
          fi

      - name: Test & build
        run: |
          npm test
          npm run build
          npm run size -w @pulse-circle/web

      - name: Publish to npm (OIDC trusted publishing)
        # No NODE_AUTH_TOKEN: npm >= 11.5.1 mints a short-lived OIDC credential
        # from the id-token permission above. Provenance is generated automatically.
        run: npm publish -w ${{ steps.pkg.outputs.workspace }} --access public
