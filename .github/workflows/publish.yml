name: Publish

# Tag-triggered npm publish. Tag format: <package>-v<version>, e.g.
#   core-v0.1.0 | web-v0.1.0 | react-native-v0.1.0
# The tag prefix selects the workspace so platforms version independently.
on:
  push:
    tags:
      - 'core-v*'
      - 'web-v*'
      - 'react-native-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm ci

      - name: Resolve package from tag
        id: pkg
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            core-v*)         echo "workspace=@pulse/core" >> "$GITHUB_OUTPUT" ;;
            web-v*)          echo "workspace=@pulse/web" >> "$GITHUB_OUTPUT" ;;
            react-native-v*) echo "workspace=@pulse/react-native" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unrecognized tag $tag" && exit 1 ;;
          esac
          echo "version=${tag##*-v}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json version
        run: |
          pkg_version=$(node -p "require('./packages/${GITHUB_REF_NAME%%-v*}/package.json').version")
          if [ "$pkg_version" != "${{ steps.pkg.outputs.version }}" ]; then
            echo "Tag version ${{ steps.pkg.outputs.version }} != package.json $pkg_version" && exit 1
          fi

      - name: Test & build
        run: |
          npm test
          npm run build
          npm run size -w @pulse/web

      - name: Publish to npm
        run: npm publish -w ${{ steps.pkg.outputs.workspace }} --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
